[package]
name = "opentech-firmware-stm32"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "no_std STM32 safety skeleton for OpenTech-ECU (not vehicle-ready)"

[features]
default = []
std = ["ecu-trigger/std", "ecu-protection/std"]

[dependencies]
ecu-trigger = { path = "../../crates/ecu-trigger", default-features = false }
ecu-protection = { path = "../../crates/ecu-protection", default-features = false }
